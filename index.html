<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicolas - Chuva de Maçãs 🍎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b9fbc0, #f9f7ae);
      text-align: center;
      color: #234b27;
    }

    h1 {
      margin-top: 25px;
      font-size: 35px;
    }

    .container {
      max-width: 550px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px #0002;
    }

    .placar {
      display: flex;
      justify-content: space-around;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    canvas {
      background: linear-gradient(#bdefff, #e9ffd8);
      width: 100%;
      border: 4px solid #52a447;
      border-radius: 15px;
      touch-action: none;
    }

    button {
      background: #ff5555;
      color: white;
      border: none;
      padding: 14px 25px;
      margin: 10px 5px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #d93636;
    }

    .controles {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .controles button {
      font-size: 28px;
      width: 85px;
      touch-action: none;
    }

    footer {
      margin: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>🍎 O Mundo do Nicolas 🍎</h1>
  <p>Bem-vindo ao meu primeiro jogo!</p>

  <div class="container">

    <h2>🧺 Chuva de Maçãs</h2>

    <p>Pegue as maçãs antes que caiam no chão!</p>

    <div class="placar">
      <span>⭐ Pontos: <span id="pontos">0</span></span>
      <span>❤️ Vidas: <span id="vidas">3</span></span>
    </div>

    <canvas id="jogo" width="480" height="400"></canvas>

    <br>

    <button onclick="iniciarJogo()">▶ Começar jogo</button>

    <div class="controles">
      <button id="esquerda">⬅️</button>
      <button id="direita">➡️</button>
    </div>

    <p>Use as setas do teclado ou os botões!</p>

  </div>

  <footer>
    Criado por Nicolas 🍏 | Meu primeiro site HTML
  </footer>

  <script>
    const canvas = document.getElementById("jogo");
    const ctx = canvas.getContext("2d");

    let pontos = 0;
    let vidas = 3;
    let jogando = false;
    let macas = [];
    let ultimoTempo = 0;
    let tempoCriacao = 0;
    let animacaoId = null;

    const cesta = {
      x: 200,
      y: 345,
      largura: 80,
      altura: 35,
      velocidade: 300
    };

    const teclas = {
      esquerda: false,
      direita: false
    };

    function desenharCesta() {
      ctx.font = "55px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🧺", cesta.x + cesta.largura / 2, cesta.y + 35);
    }

    function criarMaca() {
      const especial = Math.random() < 0.15;

      macas.push({
        x: 25 + Math.random() * (canvas.width - 50),
        y: -30,
        raio: 17,
        velocidade: 100 + Math.random() * 90,
        especial: especial
      });
    }

    function desenharMacas() {
      ctx.textAlign = "center";
      ctx.font = "34px Arial";

      for (const maca of macas) {
        ctx.fillText(
          maca.especial ? "🍏" : "🍎",
          maca.x,
          maca.y
        );
      }
    }

    function atualizar(delta) {
      if (teclas.esquerda) {
        cesta.x -= cesta.velocidade * delta;
      }

      if (teclas.direita) {
        cesta.x += cesta.velocidade * delta;
      }

      cesta.x = Math.max(
        0,
        Math.min(canvas.width - cesta.largura, cesta.x)
      );

      tempoCriacao += delta;

      if (tempoCriacao >= 0.9) {
        criarMaca();
        tempoCriacao = 0;
      }

      for (let i = macas.length - 1; i >= 0; i--) {
        const maca = macas[i];

        maca.y += maca.velocidade * delta;

        const pegou =
          maca.x >= cesta.x &&
          maca.x <= cesta.x + cesta.largura &&
          maca.y + maca.raio >= cesta.y &&
          maca.y - maca.raio <= cesta.y + cesta.altura;

        if (pegou) {
          pontos += maca.especial ? 30 : 10;
          macas.splice(i, 1);
          continue;
        }

        if (maca.y > canvas.height + maca.raio) {
          vidas--;
          macas.splice(i, 1);

          if (vidas <= 0) {
            finalizarJogo();
            return;
          }
        }
      }

      document.getElementById("pontos").textContent = pontos;
      document.getElementById("vidas").textContent = vidas;
    }

    function desenhar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#80c967";
      ctx.fillRect(0, 385, canvas.width, 15);

      desenharMacas();
      desenharCesta();
    }

    function loop(tempo) {
      if (!jogando) return;

      const delta = Math.min((tempo - ultimoTempo) / 1000, 0.05);
      ultimoTempo = tempo;

      atualizar(delta);
      desenhar();

      if (jogando) {
        animacaoId = requestAnimationFrame(loop);
      }
    }

    function iniciarJogo() {
      cancelAnimationFrame(animacaoId);

      pontos = 0;
      vidas = 3;
      macas = [];
      tempoCriacao = 0;
      ultimoTempo = performance.now();
      jogando = true;

      cesta.x = 200;

      document.getElementById("pontos").textContent = pontos;
      document.getElementById("vidas").textContent = vidas;

      animacaoId = requestAnimationFrame(loop);
    }

    function finalizarJogo() {
      jogando = false;

      document.getElementById("vidas").textContent = 0;

      setTimeout(() => {
        alert("🍎 Fim de jogo! Você fez " + pontos + " pontos!");
      }, 100);
    }

    document.addEventListener("keydown", (evento) => {
      if (evento.key === "ArrowLeft") {
        evento.preventDefault();
        teclas.esquerda = true;
      }

      if (evento.key === "ArrowRight") {
        evento.preventDefault();
        teclas.direita = true;
      }
    });

    document.addEventListener("keyup", (evento) => {
      if (evento.key === "ArrowLeft") {
        teclas.esquerda = false;
      }

      if (evento.key === "ArrowRight") {
        teclas.direita = false;
      }
    });

    function configurarBotao(id, direcao) {
      const botao = document.getElementById(id);

      botao.addEventListener("pointerdown", (evento) => {
        evento.preventDefault();
        teclas[direcao] = true;
        botao.setPointerCapture(evento.pointerId);
      });

      const parar = () => {
        teclas[direcao] = false;
      };

      botao.addEventListener("pointerup", parar);
      botao.addEventListener("pointercancel", parar);
      botao.addEventListener("lostpointercapture", parar);
    }

    configurarBotao("esquerda", "esquerda");
    configurarBotao("direita", "direita");

    window.addEventListener("blur", () => {
      teclas.esquerda = false;
      teclas.direita = false;
    });

    desenhar();
  </script>

</body>
</html>
